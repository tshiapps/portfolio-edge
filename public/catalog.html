<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<script>try{var t=localStorage.getItem("theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t}catch(e){}</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="/favicon-dark-ink-32.png" media="(prefers-color-scheme: light)">
<link rel="icon" type="image/png" href="/favicon-light-ink-32.png" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<link rel="stylesheet" href="/assets/site.css">
<title>Catalog · Tony Shi Photography</title>
<meta name="description" content="Browse, search and map every photograph by Tony Shi.">
</head>
<body>
<header class="site">
  <a class="logo" href="/" aria-label="Tony Shi Photography — home">
    <span class="mark" aria-hidden="true">TS</span>
    <img class="wordmark" src="/assets/logo-wordmark.png" alt="Tony Shi Photography">
  </a>
  <nav><a href="/photos">Portfolio</a><a href="/catalog" aria-current="page">Catalog</a><a href="/aerial">Reel</a><a href="/featured">Press</a><a href="/inquiry">Inquiry</a><button class="theme-toggle" type="button" aria-label="Switch light/dark"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/></svg></button></nav>
  <div id="fmenu" class="fmenu" hidden></div>
</header>
<main class="wide catalog">
  <div class="cat-head">
    <nav class="cat-tabs" aria-label="Catalog">
      <a href="/catalog" data-tab="browse">Browse</a><a href="/catalog/search" data-tab="search">Search</a><a href="/catalog/map" data-tab="map">Map</a><a href="/catalog/roll" data-tab="roll">Camera Roll</a>
    </nav>
    <span class="cat-total" id="catTotal"></span><button type="button" class="share-btn" data-share id="pageShare" title="Share"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V3.5M7.5 8 12 3.5 16.5 8M5 12v8h14v-8"/></svg><span>Share</span></button>
  </div>
  <section id="vBrowse" hidden>
    <nav class="cat-trail" id="trail" aria-label="Where you are"></nav>
    <div id="cards" class="cat-cards"></div>
    <div id="bgrid" class="jgrid"></div>
  </section>
  <section id="vSearch" hidden>
    <form id="sForm" class="cat-search" autocomplete="off">
      <div class="cat-q"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></svg>
        <input name="q" type="search" placeholder="Search everything — places, subjects, cameras…" aria-label="Search"></div>
      <div class="cat-filters">
        <select name="make" aria-label="Camera brand"><option value="">Any camera</option></select>
        <select name="camera" aria-label="Camera model"><option value="">Any model</option></select>
        <select name="from" aria-label="From year"><option value="">From</option></select>
        <select name="to" aria-label="To year"><option value="">To</option></select>
        <select name="country" aria-label="Country"><option value="">Anywhere</option></select>
        <select name="shape" aria-label="Shape"><option value="">Any shape</option><option value="horizontal">Horizontal</option><option value="vertical">Vertical</option><option value="pano">Panorama</option></select>
        <select name="getty" aria-label="On Getty Images"><option value="">Getty: any</option><option value="1">On Getty Images</option><option value="0">Not on Getty</option></select>
        <select name="sort" aria-label="Sort"><option value="popular">Most popular</option><option value="views">Most viewed</option><option value="faves">Most faved</option><option value="comments">Most commented</option><option value="here">Most viewed here</option><option value="newest">Newest</option><option value="oldest">Oldest</option></select>
        <button type="button" class="cat-clear" id="sClear">Clear</button>
      </div>
    </form>
    <p class="cat-count" id="sCount"></p>
    <div id="sgrid" class="jgrid"></div>
    <div id="sMore" class="cat-more"></div>
  </section>
  <section id="vRoll" hidden>
    <div class="roll"><div id="rollBody" class="roll-body"></div><nav id="rollRail" class="roll-rail" aria-label="Jump to a year"></nav></div>
  </section>
  <section id="vMap" hidden>
    <div id="map" class="cat-map"></div>
    <p class="cat-count" id="mCount"></p>
  </section>
</main>
<footer class="site"><span>© <span id="yr"></span> Tony Shi. All rights reserved.</span><nav class="social" aria-label="Elsewhere"><a href="https://www.flickr.com/photos/tonyshi/" target="_blank" rel="noopener" title="Flickr — Tony Shi"><img src="https://cdn.jsdelivr.net/npm/simple-icons@13/icons/flickr.svg" alt="Flickr"></a><a href="https://www.flickr.com/photos/tonyshilife/" target="_blank" rel="noopener" title="Flickr — Tony Shi Life"><img src="https://cdn.jsdelivr.net/npm/simple-icons@13/icons/flickr.svg" alt="Flickr (life)">life</a><a href="https://www.youtube.com/tonyshiphoto" target="_blank" rel="noopener" title="YouTube"><img src="https://cdn.jsdelivr.net/npm/simple-icons@13/icons/youtube.svg" alt="YouTube"></a><a href="https://www.instagram.com/tonyshiphoto/" target="_blank" rel="noopener" title="Instagram @tonyshiphoto"><img src="https://cdn.jsdelivr.net/npm/simple-icons@13/icons/instagram.svg" alt="Instagram"></a><a href="/api/go/getty" target="_blank" rel="noopener" title="Getty Images — license my photos"><img src="/assets/getty.png" alt="Getty Images"></a></nav></footer>
<script>document.getElementById("yr").textContent=new Date().getFullYear()</script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script src="/assets/photoview.js"></script>
<script src="/assets/catalog.js"></script>
<script src="/assets/theme.js"></script>
<script src="/assets/menu.js"></script>
</body>
</html>
